name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź czy tag zgadza się z manifest.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST=$(jq -r .version manifest.json)
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Tag ($TAG) != wersja w manifest.json ($MANIFEST)"
            exit 1
          fi

      - name: Zbuduj zip do ręcznej instalacji
        run: |
          mkdir -p claude-launcher
          cp main.js manifest.json claude-launcher/
          zip -r claude-launcher.zip claude-launcher

      - name: Opublikuj release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json claude-launcher.zip
